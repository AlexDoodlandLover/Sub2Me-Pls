<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sub2Me Pls</title>

<style>
  body { background:#0d0d0d; color:white; font-family:Arial; padding:20px; }
  h2 { margin-top:0; }
  input, button, select {
    width:100%; padding:12px; margin:8px 0; border-radius:8px; border:none;
  }
  button { background:#ff4747; color:white; font-weight:bold; }
  #app, #campaignView, #videoWatch, #survey, #createCampaign { display:none; }
  .card { background:#1c1c1c; padding:12px; margin:12px 0; border-radius:8px; }
</style>
</head>

<body>

<h2>Sub2Me Pls</h2>

<!-- LOGIN UI -->
<div id="auth">
  <input id="email" placeholder="Email or Username">
  <input id="password" type="password" placeholder="Password">
  <button id="signupBtn">Sign Up</button>
  <button id="loginBtn">Login</button>
  <button id="googleBtn" style="background:#4285F4;">Sign in with Google</button>
</div>

<!-- MAIN APP -->
<div id="app">
  <h3>Welcome to Sub2Me Pls 🎉</h3>
  <p id="coinsDisplay"></p>

  <button id="viewCampaigns">View Campaigns</button>
  <button id="newCampaign">Create Campaign</button>
  <button id="logoutBtn">Logout</button>
</div>

<!-- CAMPAIGN LIST -->
<div id="campaignView">
  <h3>Active Campaigns</h3>
  <div id="campaignList"></div>
  <button onclick="goHome()">Back</button>
</div>

<!-- VIDEO WATCH -->
<div id="videoWatch">
  <h3 id="channelName"></h3>
  <p>Watch the videos below:</p>
  <div id="videoList"></div>
  <button onclick="finishVideos()">Done Watching</button>
</div>

<!-- SURVEY -->
<div id="survey">
  <h3>Did this channel fit your vibe?</h3>
  <select id="vibeSelect">
    <option value="yes">Yup, I liked it</option>
    <option value="no">Not really</option>
  </select>
  <input id="surveyDesc" placeholder="What went wrong, or what did you like?">
  <button onclick="submitSurvey()">Submit</button>
</div>

<!-- CREATE CAMPAIGN -->
<div id="createCampaign">
  <h3>Create a Campaign</h3>
  <input id="channelID" placeholder="Enter YouTube Channel ID">
  <input id="subGoal" placeholder="Desired Subscribers (100 coins = 100 subs)">
  <button id="createBtn">Create</button>
  <button onclick="goHome()">Cancel</button>
</div>

<script type="module">
  /* ------------------------ FIREBASE IMPORTS ------------------------ */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import { 
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

  import { 
    getFirestore,
    doc,
    setDoc,
    getDoc,
    updateDoc,
    collection,
    getDocs,
    addDoc
  } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

  /* ------------------------ FIREBASE CONFIG ------------------------ */
  const firebaseConfig = {
    apiKey: "AIzaSyDslpBSIz_bl_RxNmAuCUYTrrP0OsQI89c",
    authDomain: "sub2me-pls.firebaseapp.com",
    projectId: "sub2me-pls",
    storageBucket: "sub2me-pls.firebasestorage.app",
    messagingSenderId: "137292027414",
    appId: "1:137292027414:web:495ac4da8bcc7109800737",
    measurementId: "G-HLH74P7D5J"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth();
  const db = getFirestore();

  /* ------------------------ YOUTUBE API ------------------------ */
  const YT_API_KEY = "AIzaSyCCoUFdxXyECGjo_Rc6P5LdGSudpo1FFwk";

  async function fetchChannel(id) {
    const res = await fetch(
      `https://www.googleapis.com/youtube/v3/channels?part=snippet&id=${id}&key=${YT_API_KEY}`
    );
    return (await res.json()).items[0];
  }

  async function fetchVideos(id) {
    const res = await fetch(
      `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${id}&maxResults=10&order=date&key=${YT_API_KEY}`
    );
    return (await res.json()).items;
  }

  /* ------------------------ AUTH LOGIC ------------------------ */
  signupBtn.onclick = async () => {
    await createUserWithEmailAndPassword(auth, email.value, password.value);
    await setDoc(doc(db, "users", auth.currentUser.uid), {
      coins: 50
    });
  };

  loginBtn.onclick = () => {
    signInWithEmailAndPassword(auth, email.value, password.value);
  };

  googleBtn.onclick = () => {
    signInWithPopup(auth, new GoogleAuthProvider());
  };

  logoutBtn.onclick = () => signOut(auth);

  /* ------------------------ AUTH STATE ------------------------ */
  onAuthStateChanged(auth, async user => {
    if (user) {
      auth.style.display = "none";
      app.style.display = "block";
      const snap = await getDoc(doc(db, "users", user.uid));
      document.getElementById("coinsDisplay").innerText =
        "Coins: " + snap.data().coins;
    } else {
      auth.style.display = "block";
      app.style.display = "none";
    }
  });

  /* ------------------------ CAMPAIGNS ------------------------ */
  viewCampaigns.onclick = async () => {
    app.style.display = "none";
    campaignView.style.display = "block";

    const list = document.getElementById("campaignList");
    list.innerHTML = "";

    const snap = await getDocs(collection(db, "campaigns"));
    snap.forEach(c => {
      const data = c.data();
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <h4>${data.channelName}</h4>
        <button onclick="startWatching('${data.channelId}')">View Videos</button>
      `;
      list.appendChild(div);
    });
  };

  newCampaign.onclick = () => {
    app.style.display = "none";
    createCampaign.style.display = "block";
  };

  createBtn.onclick = async () => {
    const cid = channelID.value;
    const subs = Number(subGoal.value);

    const user = auth.currentUser;
    const userData = await getDoc(doc(db, "users", user.uid));

    if (userData.data().coins < subs) {
      alert("Not enough coins 👀");
      return;
    }

    const channel = await fetchChannel(cid);

    await addDoc(collection(db, "campaigns"), {
      channelId: cid,
      channelName: channel.snippet.title,
      creator: user.uid
    });

    await updateDoc(doc(db, "users", user.uid), {
      coins: userData.data().coins - subs
    });

    alert("Campaign created!");
    goHome();
  };

  /* ------------------------ WATCH VIDEOS ------------------------ */
  window.startWatching = async (cid) => {
    campaignView.style.display = "none";
    videoWatch.style.display = "block";

    const videos = await fetchVideos(cid);
    channelName.innerText = "Channel Videos";

    const list = document.getElementById("videoList");
    list.innerHTML = "";

    videos.forEach(v => {
      const vid = document.createElement("div");
      vid.className = "card";
      vid.innerHTML = `
        <p>${v.snippet.title}</p>
        <iframe width="100%" height="200"
          src="https://www.youtube.com/embed/${v.id.videoId}">
        </iframe>
      `;
      list.appendChild(vid);
    });
  };

  window.finishVideos = () => {
    videoWatch.style.display = "none";
    survey.style.display = "block";
  };

  /* ------------------------ SURVEY ------------------------ */
  window.submitSurvey = async () => {
    const vibe = vibeSelect.value;
    const desc = surveyDesc.value;

    alert("Thanks! Coins +10");

    const user = auth.currentUser;
    const snap = await getDoc(doc(db, "users", user.uid));

    await updateDoc(doc(db, "users", user.uid), {
      coins: snap.data().coins + 10
    });

    goHome();
  };

  /* ------------------------ UTIL ------------------------ */
  window.goHome = () => {
    campaignView.style.display = "none";
    videoWatch.style.display = "none";
    survey.style.display = "none";
    createCampaign.style.display = "none";
    app.style.display = "block";
  };
</script>

</body>
</html>
